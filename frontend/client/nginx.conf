server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS; looked up at request time so nginx starts even if the API is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Backend API (same address as the site, so no CORS setup is needed)
  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
  }

  location /health {
    set $api http://api:8080;
    proxy_pass $api;
  }

  # Fingerprinted build files can be cached for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The service worker and index must always be re-checked
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Single-page app: any other path serves index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
