# NetworkPolicy
#
# Default: deny all ingress and egress in the ecommerce namespace.
# Then allow specific traffic patterns:
#   1. All pods: DNS egress to kube-system
#   2. API pods: accept HTTP from Ingress/other namespaces, talk to MongoDB + NATS
#   3. Worker pods: talk to MongoDB + NATS only
#   4. Monitoring: allow Prometheus to scrape /metrics
#
# Infrastructure (MongoDB, NATS) may live in the same namespace (small
# deployments), a dedicated namespace, or outside the cluster entirely.
# The egress policies use both podSelector (same-NS) and namespaceSelector
# (cross-NS) to support all layouts. If infra is external, add IP block
# egress rules or use a ServiceEntry (Istio) / EndpointSlice proxy.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS (required for all pods to resolve service names)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ecommerce
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# API: allow ingress from anywhere (Ingress controller will route)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-ingress
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  ingress:
    - from:
        - namespaceSelector: {}     # allow from any namespace (Ingress controller)
      ports:
        - protocol: TCP
          port: 8080
---
# API: allow Prometheus to scrape metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-metrics
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring  # adjust to your monitoring namespace
      ports:
        - protocol: TCP
          port: 9090
---
# API: allow egress to MongoDB
# Supports MongoDB in the same namespace (via podSelector) or a separate
# namespace (via namespaceSelector). Both selectors are ORed by K8s when
# inside the same `to` entry, so this covers both deployment layouts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-mongodb
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  egress:
    - to:
        # Same-namespace: MongoDB pod with label app.kubernetes.io/name=mongodb
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
        # Cross-namespace: MongoDB in a namespace labelled app.kubernetes.io/part-of=ecommerce
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
# API: allow egress to NATS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-nats
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
---
# Worker: allow egress to MongoDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-allow-mongodb
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
# Worker: allow egress to NATS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-allow-nats
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
