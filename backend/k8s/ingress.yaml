# Ingress
#
# Uses NGINX Ingress Controller (default in most clusters).
# Adjust ingressClassName for your controller (traefik, alb, etc.).
#
# TLS: use cert-manager for automatic certificate provisioning.
#   apiVersion: cert-manager.io/v1
#   kind: Certificate
#   metadata:
#     name: ecommerce-tls
#     namespace: ecommerce
#   spec:
#     secretName: ecommerce-tls-secret
#     issuerRef:
#       name: letsencrypt-prod
#       kind: ClusterIssuer
#     dnsNames:
#       - ecommerce.example.com

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-api
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ecommerce
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"      # match Fiber BodyLimit
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "15"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Pass real client IP
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  # Uncomment for TLS (requires cert-manager or pre-created secret):
  # tls:
  #   - hosts:
  #       - ecommerce.example.com
  #     secretName: ecommerce-tls-secret
  rules:
    - host: ecommerce.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-api
                port:
                  number: 80
