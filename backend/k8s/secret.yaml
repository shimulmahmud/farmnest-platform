# Secret template for the ecommerce application.
# 
# IMPORTANT: This file contains placeholder values. In production:
#   1. Create the Secret with real values:
#        kubectl create secret generic ecommerce-secret \
#          --from-literal=jwt-secret='<random-32+-char-string>' \
#          --from-literal=mongodb-uri='mongodb://user:pass@mongodb:27017' \
#          --from-literal=nats-url='nats://user:pass@nats:4222' \
#          --from-literal=webhook-secret-fake='<hmac-secret>' \
#          -n ecommerce
#   2. Do NOT commit this file with real values to version control.
#   3. Consider using Sealed Secrets, External Secrets Operator, or
#      cloud KMS (AWS Secrets Manager, GCP Secret Manager) for production.

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
# base64-encoded placeholder values (decoded: "CHANGE-ME")
data:
  # JWT signing secret — MUST be >= 32 characters
  jwt-secret: Q0hBTkdFLU1F
  # MongoDB connection URI with credentials
  mongodb-uri: bW9uZ29kYjovL2NoYW5nZS1tZS1pbi1wcm9kdWN0aW9u
  # NATS connection URL (with auth if needed)
  nats-url: bmF0czovL2NoYW5nZS1tZS1pbi1wcm9kdWN0aW9u
  # Webhook HMAC secrets per provider
  webhook-secret-fake: Q0hBTkdFLU1F
