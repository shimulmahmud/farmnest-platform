# Horizontal Pod Autoscaler
# 
# API: scales on CPU. The Go HTTP server is CPU-bound under load
# (JSON marshaling, JWT validation, bcrypt for login). Target 80% to allow
# headroom for traffic spikes before new pods are needed.
#
# Worker: scales on CPU. Message processing is CPU-bound (deserialization)
# and I/O-bound (MongoDB writes). CPU is a reasonable proxy for both.
# For consumer-lag-based scaling, use a custom metric via Prometheus adapter.
#
# Minimum replicas: 3 for API (HA across zones), 2 for Worker.
# Maximum: 20 is a safety cap — tune based on load test results (M29).

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecommerce-api
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # don't scale up too aggressively
      policies:
        - type: Pods
          value: 2                 # add at most 2 pods per 60s
          periodSeconds: 60
        - type: Percent
          value: 50                # or 50% of current replicas
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1                 # remove at most 1 pod per 5 min
          periodSeconds: 300
      selectPolicy: Min
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecommerce-worker
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
      selectPolicy: Min
