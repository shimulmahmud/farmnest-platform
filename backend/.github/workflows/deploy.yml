# Deploy workflow — triggered manually or by CI on main.
#
# This workflow handles deployment to different environments.
# It can be triggered:
#   1. Automatically after CI pipeline succeeds (workflow_run)
#   2. Manually via workflow_dispatch (e.g., rollback, redeploy)
#   3. On tag push for release deployments

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Image version/tag to deploy (default: latest)'
        required: false
        type: string
      skip_tests:
        description: 'Skip pre-deploy smoke tests'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Only one deploy at a time per environment
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve deployment parameters
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            VER="${{ github.event.inputs.version }}"
          else
            ENV="staging"
            VER="${{ github.event.workflow_run.head_sha }}"
          fi
          
          # Default to short SHA if no version specified
          if [ -z "$VER" ]; then
            VER="${GITHUB_SHA:0:7}"
          fi
          
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Deploying version ${VER} to ${ENV}"

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [prepare]
    if: "${{ github.event.inputs.skip_tests }}" != 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9332eeee6424075 # v5.4.0
        with:
          go-version: '1.22'
      - name: Download modules
        run: go mod download
      - name: Build test binary
        run: go test -c -o /tmp/smoke-test ./...
      - name: Run smoke tests
        run: |
          # Quick unit tests as pre-deploy gate
          go test -short -count=1 -timeout=120s ./...

  deploy:
    name: Deploy to ${{ needs.prepare.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [prepare, smoke-test]
    if: always() && needs.prepare.result == 'success'
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up kubectl
        uses: azure/setup-kubectl@3e0aec4d023a5eb5c408b1126c15f739e3dfca54 # v4.0.0
      - name: Set kubeconfig
        run: |
          # kubeconfig should be stored as a repository or environment secret
          # This placeholder shows the pattern — use actual secret in production
          mkdir -p $HOME/.kube
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
          else
            echo "WARNING: KUBECONFIG secret not set. Skipping kubectl apply."
            echo "Set KUBECONFIG secret (base64-encoded) for this environment."
            exit 1
          fi
      - name: Update image tags in manifests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          
          sed -i "s|image: ecommerce-api:.*|image: ${REPO}/ecommerce-api:${VERSION}|" k8s/api-deployment.yaml
          sed -i "s|image: ecommerce-worker:.*|image: ${REPO}/ecommerce-worker:${VERSION}|" k8s/worker-deployment.yaml
          
          echo "Deploying images:"
          grep 'image:' k8s/api-deployment.yaml | head -1
          grep 'image:' k8s/worker-deployment.yaml | head -1
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ecommerce-api -n ecommerce --timeout=300s
          kubectl rollout status deployment/ecommerce-worker -n ecommerce --timeout=300s
      - name: Verify deployment
        run: |
          echo "## Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          API_REPLICAS=$(kubectl get deployment ecommerce-api -n ecommerce -o jsonpath='{.status.readyReplicas}')
          WORKER_REPLICAS=$(kubectl get deployment ecommerce-worker -n ecommerce -o jsonpath='{.status.readyReplicas}')
          
          echo "| Component | Ready Replicas |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${API_REPLICAS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | ${WORKER_REPLICAS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Verify pods are running
          if [ "${API_REPLICAS}" = "0" ] || [ -z "${API_REPLICAS}" ]; then
            echo "::error::API deployment has 0 ready replicas"
            exit 1
          fi
      - name: Deployment summary
        run: |
          echo "## Deployed to ${{ needs.prepare.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: \\"${{ needs.prepare.outputs.version }}\\" " >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
