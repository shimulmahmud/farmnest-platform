# Backend only (API, worker, database, queue, mail catcher).
# To run the whole platform (backend + admin + storefront) use the docker-compose.yml in the project root.

version: "3.9"

services:
  # ============================================================
  # Infrastructure
  # ============================================================
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: nats:2.10-alpine3.19
    container_name: ecommerce-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # Monitoring dashboard
    command: >-
      --js
      --store_dir /data
      --cluster_name ecommerce-cluster
      -m 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ============================================================
  # Seed Data (runs once, then exits)
  # ============================================================
  seed:
    image: mongo:7
    container_name: ecommerce-seed
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./scripts/seed.js:/seed.js:ro
    entrypoint:
      ["mongosh", "mongodb://mongodb:27017/ecommerce", "--file", "/seed.js"]

  # ============================================================
  # Application
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_started
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ecommerce-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  mongodb_data:
  nats_data:
