server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

mongodb:
  uri: "mongodb://localhost:27017"
  database: "ecommerce"
  max_pool_size: 100
  min_pool_size: 5
  connect_timeout: "10s"

nats:
  url: "nats://localhost:4222"
  cluster_name: "ecommerce-cluster"
  reconnect_wait: "2s"
  max_reconnects: 5
  connect_timeout: "5s"

nats_kv:
  buckets:
    - name: "PRODUCT_CACHE"
      history: 1
    - name: "CATEGORY_CACHE"
      history: 1
    - name: "SESSION_STATE"
      history: 0
    - name: "IDEMPOTENCY"
      history: 0
    - name: "RATE_LIMIT"
      history: 0
    - name: "CHECKOUT_STATE"
      history: 0
    - name: "DISTRIBUTED_LOCKS"
      history: 0

logging:
  level: "info"
  encoding: "json"
  output: "stdout"

security:
  cors_allowed_origins:
    - "*"
  cors_allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  cors_allowed_headers:
    - "*"
  rate_limit_per_minute: 100

jwt:
  secret: "change-me-in-production"
  access_ttl: "15m"
  refresh_ttl: "168h"
  issuer: "ecommerce-api"

observability:
  service_name: "ecommerce-api"
  enabled: true
  prometheus_port: 9090
