# The LIVE shop: HTTPS, private database with a password, no demo data, daily backups.
#
#   cp .env.production.example .env.production      (then fill it in)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Then create your admin account (see PRODUCTION.md). For trying things out on your own
# computer use the plain docker-compose.yml instead.
name: farmnest-prod

x-backend-env: &backend-env
  APP_ENV: production
  LOG_LEVEL: info
  OTEL_ENABLED: "false"
  MONGODB_URI: mongodb://${MONGO_USER:-shop}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env.production}@mongodb:27017/?authSource=admin
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
  WEBHOOK_SECRET_FAKE: ${JWT_SECRET}
  CORS_ALLOWED_ORIGINS: https://${SHOP_DOMAIN:?set SHOP_DOMAIN},https://${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST (your email provider) in .env.production}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM, for example no-reply@yourshop.com}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  APP_NAME: ${APP_NAME:-FarmNest}
  APP_URL: https://${SHOP_DOMAIN}
  ADMIN_URL: https://${ADMIN_DOMAIN}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
  BRAND_COLOR: ${BRAND_COLOR:-#1f5c3a}

services:
  # --- Only this service is reachable from the internet ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (for certificate notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - admin

  # --- Private services (no published ports) ---
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-shop}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-shop}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  nats:
    image: nats:2.10-alpine3.19
    restart: unless-stopped
    command: >-
      --js
      --store_dir /data
      --cluster_name ecommerce-cluster
      -m 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker   # base settings; the lines below override them for production
    environment:
      <<: *backend-env
      UPLOAD_DIR: /data/uploads
      PAYMENT_BKASH_NUMBER: ${PAYMENT_BKASH_NUMBER:-}
      PAYMENT_NAGAD_NUMBER: ${PAYMENT_NAGAD_NUMBER:-}
      PAYMENT_ROCKET_NUMBER: ${PAYMENT_ROCKET_NUMBER:-}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      <<: *backend-env
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy

  admin:
    build:
      context: ./frontend/admin
      args:
        VITE_APP_NAME: ${APP_NAME:-FarmNest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  client:
    build:
      context: ./frontend/client
      args:
        VITE_SITE_URL: https://${SHOP_DOMAIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # --- Daily backup of the database and uploaded pictures into ./backups ---
  backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      BACKUP_URI: mongodb://${MONGO_USER:-shop}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads_data:/data/uploads:ro
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          if mongodump --uri="$$BACKUP_URI" --archive="/backups/db-$$stamp.gz" --gzip --quiet; then
            echo "backup ok: db-$$stamp.gz"
          else
            echo "BACKUP FAILED at $$stamp" >&2
          fi
          tar czf "/backups/uploads-$$stamp.tgz" -C /data/uploads . 2>/dev/null || true
          find /backups \( -name 'db-*.gz' -o -name 'uploads-*.tgz' \) -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  mongodb_data:
  nats_data:
  uploads_data:
  caddy_data:
  caddy_config:
